<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fertilizer Manager - Input</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">O&amp;T Solution Sdn Bhd</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav" aria-controls="topNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="topNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Input Data</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" id="navExport">Export Excel</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Dashboard</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container">

    <div class="card mb-4">
        <div class="card-header">Add Production</div>
        <div class="card-body">
            <form id="prodForm" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Item Name</label>
                    <input list="itemList" class="form-control" id="prodItem" required>
                    <datalist id="itemList">
                        <option value="HC 45"></option>
                        <option value="HC 44"></option>
                    </datalist>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Production Qty (Ton)</label>
                    <input type="number" step="0.01" class="form-control" id="prodQty" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Production Date</label>
                    <input type="date" class="form-control" id="prodDate" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="prodStatus">
                        <option value="Complete">Complete</option>
                        <option value="Cancel">Cancel</option>
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label">Notes</label>
                    <input type="text" class="form-control" id="prodNotes">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Add Production</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Add Shipment</div>
        <div class="card-body">
            <form id="shipForm" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Item Name</label>
                    <input list="itemList" class="form-control" id="shipItem" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Shipped Qty (Ton)</label>
                    <input type="number" step="0.01" class="form-control" id="shipQty" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Shipping Date</label>
                    <input type="date" class="form-control" id="shipDate" required>
                </div>
                <div class="col-md-12">
                    <label class="form-label">Notes</label>
                    <input type="text" class="form-control" id="shipNotes">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">Add Shipment</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header">Record List</div>
        <div class="card-body p-0">
            <div class="row g-3 p-3">
                <div class="col-md-3">
                    <select id="filterWeek" class="form-select"></select>
                </div>
                <div class="col-md-3">
                    <select id="filterItem" class="form-select"></select>
                </div>
                <div class="col-md-3">
                    <select id="filterStatus" class="form-select">
                        <option value="">All Status</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Complete">Complete</option>
                        <option value="Cancel">Cancel</option>
                    </select>
                </div>
            </div>
            <table id="recordTable" class="table table-bordered table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Item</th>
                        <th>Produced</th>
                        <th>P/O Date</th>
                        <th>Shipped</th>
                        <th>D'ry Date</th>
                        <th>Inventory</th>
                        <th>% Done</th>
                        <th>Status</th>
                        <th>Notes</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <form id="editForm" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Record</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body row g-3">
                    <input type="hidden" id="editId">
                    <div class="col-md-6">
                        <label class="form-label">Item</label>
                        <input list="itemList" class="form-control" id="editItem" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <select id="editStatus" class="form-select">
                            <option value="In Progress">In Progress</option>
                            <option value="Complete">Complete</option>
                            <option value="Cancel">Cancel</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Produced Qty</label>
                        <input type="number" step="0.01" class="form-control" id="editProdQty">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">P/O Date</label>
                        <input type="date" class="form-control" id="editProdDate">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Shipped Qty</label>
                        <input type="number" step="0.01" class="form-control" id="editShipQty">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">D'ry Date</label>
                        <input type="date" class="form-control" id="editShipDate">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Notes</label>
                        <textarea id="editNotes" class="form-control"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
